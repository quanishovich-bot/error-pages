<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; margin: 0; }
        @keyframes anim-404 {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(5deg); }
            75% { transform: translateY(-20px) rotate(-5deg); }
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.5); opacity: 0.8; }
        }
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .icon-container { animation: anim-404 4s ease-in-out infinite; }
        .glow-dot { animation: pulse-glow 2s infinite; }
        .title-anim { animation: fade-in-up 0.8s ease-out 0.2s both; }
        .text-anim { animation: fade-in 1s ease-out 0.5s both; }
    </style>
</head>
<body>
    <div class="min-h-screen overflow-hidden relative flex items-center justify-center text-white">
        <div class="absolute inset-0 z-0 opacity-[0.04] pointer-events-none mix-blend-overlay" style="background-image: url(&quot;data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E&quot;)"></div>
        <div class="absolute inset-0 z-0 opacity-20 pointer-events-none" style="background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 40px 40px;"></div>
        <div id="spotlight" class="pointer-events-none absolute inset-0 z-10 transition-opacity duration-300" style="background: radial-gradient(circle 800px at 50% 50%, rgba(255,255,255, 0.08) 0%, transparent 80%);"></div>
        <div class="pointer-events-none absolute inset-0 z-0" style="background: radial-gradient(circle at 50% 50%, rgba(255,255,255, 0.03) 0%, transparent 100%);"></div>

        <div class="relative z-20 text-center flex flex-col items-center w-full px-4">
            <div class="relative icon-container">
                <svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white/80 drop-shadow-[0_0_30px_rgba(255,255,255,0.3)]"><path d="M9 10h.01"/><path d="M15 10h.01"/><path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z"/></svg>
                <div class="absolute -top-4 -right-4 w-8 h-8 bg-white/20 rounded-full blur-xl glow-dot"></div>
            </div>

            <h1 class="text-[150px] font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-white/20 leading-none tracking-tighter mt-8 title-anim">
                404
            </h1>

            <div class="space-y-6 mt-4 text-anim">
                <h2 class="text-2xl md:text-3xl text-white/80 font-light tracking-wide">
                    Looks like you're lost in the void.
                </h2>
                <p class="text-white/50 max-w-md mx-auto">
                    The page you are looking for has vanished into the dark matter of the internet.
                </p>

                <a href="https://adixxlee.ru" class="inline-flex items-center gap-2 px-8 py-4 bg-white text-black rounded-full font-medium hover:scale-105 transition-transform mt-8">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    Return to Home
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('mousemove', (e) => {
            const spotlight = document.getElementById('spotlight');
            spotlight.style.background = `radial-gradient(circle 800px at ${e.clientX}px ${e.clientY}px, rgba(255,255,255, 0.08) 0%, transparent 80%)`;
        });
    </script>
</body>
</html>
